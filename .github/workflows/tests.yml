name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install LangChain components used by unit tests
        run: python -m pip install "langchain-core>=0.3,<2.0" "langchain-text-splitters>=0.3,<2.0"
      - name: Check Python syntax
        run: python -m compileall -q app.py raglab tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
